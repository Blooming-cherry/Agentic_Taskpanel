[project]
name = "taskpanel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=0.34"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
